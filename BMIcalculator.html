<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced BMI Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 400px;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 48%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            font-size: 16px;
        }

        .calculate {
            background: #28a745;
        }

        .reset {
            background: #dc3545;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }

        #result {
            margin-top: 20px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        #category {
            text-align: center;
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        #idealWeight {
            text-align: center;
            margin-top: 10px;
            font-size: 16px;
        }

        .progress-container {
            width: 100%;
            height: 25px;
            background: #ddd;
            border-radius: 20px;
            margin-top: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: green;
            transition: 0.5s;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>BMI Calculator</h1>

        <div class="input-group">
            <label>Age</label>
            <input type="number" id="age" placeholder="Enter Age">
        </div>

        <div class="input-group">
            <label>Gender</label>
            <select id="gender">
                <option value="">Select Gender</option>
                <option>Female</option>
                <option>Male</option>
            </select>
        </div>

        <div class="input-group">
            <label>Weight (kg)</label>
            <input type="number" id="weight" placeholder="Enter Weight">
        </div>

        <div class="input-group">
            <label>Height (cm)</label>
            <input type="number" id="height" placeholder="Enter Height">
        </div>

        <div class="btn-group">
            <button class="calculate" onclick="calculateBMI()">
                Calculate
            </button>

            <button class="reset" onclick="resetForm()">
                Reset
            </button>
        </div>

        <div id="result"></div>

        <div id="category"></div>

        <div id="idealWeight"></div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

    </div>

    <script>

        function calculateBMI() {

            let age =
                document.getElementById("age").value;

            let gender =
                document.getElementById("gender").value;

            let weight =
                parseFloat(
                    document.getElementById("weight").value
                );

            let height =
                parseFloat(
                    document.getElementById("height").value
                );

            if (
                age === "" ||
                gender === "" ||
                isNaN(weight) ||
                isNaN(height) ||
                weight <= 0 ||
                height <= 0
            ) {
                alert("Please fill all fields correctly.");
                return;
            }

            let heightMeter =
                height / 100;

            let bmi =
                weight /
                (heightMeter * heightMeter);

            bmi =
                bmi.toFixed(2);

            let category =
                document.getElementById("category");

            let color =
                "green";

            let status =
                "";

            if (bmi < 18.5) {
                status = "Underweight";
                color = "orange";
            }
            else if (bmi < 25) {
                status = "Normal Weight";
                color = "green";
            }
            else if (bmi < 30) {
                status = "Overweight";
                color = "goldenrod";
            }
            else {
                status = "Obese";
                color = "red";
            }

            document.getElementById("result")
                .innerHTML =
                `BMI: ${bmi}`;

            category.innerHTML =
                `Category: ${status}`;

            category.style.color =
                color;

            let minWeight =
                (18.5 * heightMeter * heightMeter)
                    .toFixed(1);

            let maxWeight =
                (24.9 * heightMeter * heightMeter)
                    .toFixed(1);

            document.getElementById("idealWeight")
                .innerHTML =
                `Ideal Weight Range:
         ${minWeight} kg - ${maxWeight} kg`;

            let progress =
                Math.min(
                    (bmi / 40) * 100,
                    100
                );

            let progressBar =
                document.getElementById("progressBar");

            progressBar.style.width =
                progress + "%";

            progressBar.style.background =
                color;
        }

        function resetForm() {

            document.getElementById("age").value = "";
            document.getElementById("gender").value = "";
            document.getElementById("weight").value = "";
            document.getElementById("height").value = "";

            document.getElementById("result").innerHTML = "";
            document.getElementById("category").innerHTML = "";
            document.getElementById("idealWeight").innerHTML = "";

            document.getElementById("progressBar")
                .style.width = "0%";
        }

    </script>

</body>

</html>
