<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f4f4;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            width: 350px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        button:hover {
            background: #0056b3;
        }

        #result {
            margin-top: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        #category {
            margin-top: 10px;
            text-align: center;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>BMI Calculator</h1>

        <div class="input-group">
            <label for="weight">Weight (kg)</label>
            <input type="number" id="weight" placeholder="Enter weight">
        </div>

        <div class="input-group">
            <label for="height">Height (cm)</label>
            <input type="number" id="height" placeholder="Enter height">
        </div>

        <button onclick="calculateBMI()">
            Calculate BMI
        </button>

        <div id="result"></div>
        <div id="category"></div>

    </div>

    <script>

        function calculateBMI() {

            let weight =
                parseFloat(
                    document.getElementById("weight").value
                );

            let height =
                parseFloat(
                    document.getElementById("height").value
                );

            if (isNaN(weight) || isNaN(height) ||
                weight <= 0 || height <= 0) {

                document.getElementById("result")
                    .innerText =
                    "Please enter valid values";

                document.getElementById("category")
                    .innerText = "";

                return;
            }

            height = height / 100;

            let bmi =
                weight / (height * height);

            bmi = bmi.toFixed(2);

            let category = "";

            if (bmi < 18.5) {
                category = "Underweight";
            }
            else if (bmi < 25) {
                category = "Normal Weight";
            }
            else if (bmi < 30) {
                category = "Overweight";
            }
            else {
                category = "Obese";
            }

            document.getElementById("result")
                .innerText =
                "BMI: " + bmi;

            document.getElementById("category")
                .innerText =
                "Category: " + category;
        }

    </script>

</body>

</html>
