<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Tip Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f4f4;
            transition: .3s;
        }

        .container {
            width: 450px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, .2);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .tip-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .tip-buttons button {
            flex: 1;
            background: #007bff;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        .calculate {
            background: #28a745;
        }

        .reset {
            background: #dc3545;
        }

        .theme {
            background: #6f42c1;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .result {
            margin-top: 20px;
            line-height: 1.8;
        }

        .highlight {
            color: #007bff;
            font-weight: bold;
        }

        .dark {
            background: #121212;
            color: white;
        }

        .dark .container {
            background: #222;
        }

        .dark input {
            background: #333;
            color: white;
            border-color: #555;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Tip Calculator</h1>

        <div class="input-group">
            <label>Bill Amount (₹)</label>
            <input type="number" id="bill">
        </div>

        <div class="tip-buttons">
            <button onclick="setTip(5)">5%</button>
            <button onclick="setTip(10)">10%</button>
            <button onclick="setTip(15)">15%</button>
            <button onclick="setTip(20)">20%</button>
        </div>

        <div class="input-group">
            <label>Custom Tip %</label>
            <input type="number" id="tip">
        </div>

        <div class="input-group">
            <label>GST / Tax %</label>
            <input type="number" id="tax" value="18">
        </div>

        <div class="input-group">
            <label>Number of People</label>
            <input type="number" id="people" value="1">
        </div>

        <div class="actions">

            <button class="calculate" onclick="calculateBill()">
                Calculate
            </button>

            <button class="reset" onclick="resetForm()">
                Reset
            </button>

            <button class="theme" onclick="toggleTheme()">
                Theme
            </button>

        </div>

        <div class="result" id="result"></div>

    </div>

    <script>

        function setTip(percent) {

            document.getElementById("tip")
                .value = percent;
        }

        function calculateBill() {

            const bill =
                parseFloat(
                    document.getElementById("bill").value
                );

            const tipPercent =
                parseFloat(
                    document.getElementById("tip").value
                );

            const taxPercent =
                parseFloat(
                    document.getElementById("tax").value
                );

            const people =
                parseInt(
                    document.getElementById("people").value
                );

            if (
                isNaN(bill) ||
                isNaN(tipPercent) ||
                isNaN(taxPercent) ||
                isNaN(people) ||
                people <= 0
            ) {
                alert("Please fill all fields");
                return;
            }

            const tipAmount =
                bill * tipPercent / 100;

            const taxAmount =
                bill * taxPercent / 100;

            const total =
                bill + tipAmount + taxAmount;

            const perPerson =
                total / people;

            document.getElementById("result")
                .innerHTML = `

        <p>
        Bill Amount:
        <span class="highlight">
        ₹${bill.toFixed(2)}
        </span>
        </p>

        <p>
        Tip Amount:
        <span class="highlight">
        ₹${tipAmount.toFixed(2)}
        </span>
        </p>

        <p>
        Tax Amount:
        <span class="highlight">
        ₹${taxAmount.toFixed(2)}
        </span>
        </p>

        <p>
        Total Amount:
        <span class="highlight">
        ₹${total.toFixed(2)}
        </span>
        </p>

        <p>
        Per Person:
        <span class="highlight">
        ₹${perPerson.toFixed(2)}
        </span>
        </p>
        `;
        }

        function resetForm() {

            document.getElementById("bill").value = "";
            document.getElementById("tip").value = "";
            document.getElementById("tax").value = "18";
            document.getElementById("people").value = "1";
            document.getElementById("result").innerHTML = "";
        }

        function toggleTheme() {

            document.body.classList.toggle("dark");
        }

    </script>

</body>

</html>
