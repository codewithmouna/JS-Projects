<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Changer</title>

    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body */
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            transition: background-color 0.5s ease;
            background-color: #f4f4f4;
        }

        /* Container */
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        h1 {
            margin-bottom: 20px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            background: black;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #colorCode {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Random Color Changer</h1>

        <button id="changeBtn">
            Change Color
        </button>

        <p id="colorCode">
            Color Code: #f4f4f4
        </p>
    </div>

    <script>
        const button = document.getElementById("changeBtn");
        const colorCode = document.getElementById("colorCode");

        function generateColor() {
            const randomColor =
                "#" +
                Math.floor(Math.random() * 16777215)
                    .toString(16)
                    .padStart(6, "0");

            document.body.style.backgroundColor = randomColor;

            colorCode.textContent =
                "Color Code: " + randomColor.toUpperCase();
        }

        button.addEventListener("click", generateColor);
    </script>

</body>

</html>
